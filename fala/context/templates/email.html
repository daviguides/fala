<!--
  Fala Email Template
  ─────────────────────────────────────────────────────
  Compose window preview + copy button for email body.
  All styles inline because email clients drop <style> blocks.
  Gmail-compatible: <table>, <tr>/<td>, inline styles, rgb() colors.

  PLACEHOLDERS (replace when generating):
    {{TITLE}}              — Browser tab title
    {{FROM_NAME}}          — Sender display name
    {{FROM_EMAIL}}         — Sender email
    {{TO_EMAIL}}           — Recipient email
    {{SUBJECT}}            — Email subject line
    {{EMAIL_BODY}}         — Email body with ALL styles inline.
                             Use: <p style="...">, <span style="font-weight:600">,
                             <ul style="...">, <table style="...">
                             Font: -apple-system,BlinkMacSystemFont,"Segoe UI",
                                   Helvetica,Arial,sans-serif
                             Colors: rgb() not hex
    {{BUTTON_COPY_BODY}}   — "Copiar corpo" or "Copy body"
    {{BUTTON_COPY_SUBJECT}} — "Copiar assunto" or "Copy subject"
    {{BUTTON_COPIED}}      — "Copiado" or "Copied"

  RULES:
    - ALL styles inline on each element
    - NO <style> blocks
    - NO external CSS (Tailwind, etc.)
    - NO flexbox or grid (use <table>)
    - Font stack: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif
    - Colors as rgb() values
    - <span style="font-weight:600"> for bold (more reliable than <b>)
-->
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #f9fafb;
    --card: #ffffff;
    --border: #e5e7eb;
    --header: #333333;
    --text: #333333;
    --muted: #6b7280;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111;
      --card: #1a1a1a;
      --border: #333;
      --header: #222;
      --text: #e5e5e5;
      --muted: #999;
      --accent: #818cf8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111;
    --card: #1a1a1a;
    --border: #333;
    --header: #222;
    --text: #e5e5e5;
    --muted: #999;
    --accent: #818cf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    justify-content: flex-end;
  }
  .action-btn {
    display: inline-block;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text);
    background: var(--card);
    cursor: pointer;
    font-family: inherit;
  }
  .action-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .compose {
    background: var(--card);
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .compose-header {
    background: var(--header);
    color: #fff;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 500;
  }
  .field-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .field-label { color: var(--muted); width: 60px; flex-shrink: 0; }
  .field-value { color: var(--text); }
  .compose-body {
    padding: 20px 16px;
    background: var(--card);
  }
  /* Restore defaults that reset stylesheets strip */
  .compose-body ul { list-style: disc outside; }
  .compose-body ol { list-style: decimal outside; }
  .compose-body p:not([style]) { margin: 1em 0; }
  .compose-body b, .compose-body strong { font-weight: bold; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="actions">
    <button class="action-btn" id="copy-subject" type="button">{{BUTTON_COPY_SUBJECT}}</button>
    <button class="action-btn" id="copy-body" type="button">{{BUTTON_COPY_BODY}}</button>
  </div>

  <div class="compose">
    <div class="compose-header">New Message</div>
    <div class="field-row">
      <span class="field-label">From</span>
      <span class="field-value">{{FROM_NAME}} &lt;{{FROM_EMAIL}}&gt;</span>
    </div>
    <div class="field-row">
      <span class="field-label">To</span>
      <span class="field-value">{{TO_EMAIL}}</span>
    </div>
    <div class="field-row">
      <span class="field-label">Subject</span>
      <span class="field-value" style="font-weight:500">{{SUBJECT}}</span>
    </div>

    <!-- EMAIL BODY: all styles inline, no <style> blocks -->
    <div class="compose-body" id="email-body">
      {{EMAIL_BODY}}
    </div>
    <!-- END EMAIL BODY -->
  </div>

  <p class="hint">"{{BUTTON_COPY_BODY}}" copies formatted HTML. Paste directly in Gmail with Cmd+V.</p>
</div>

<script>
function flash(button, message) {
  var original = button.textContent;
  button.textContent = message;
  setTimeout(function() { button.textContent = original; }, 1500);
}

document.getElementById('copy-body').addEventListener('click', async function(event) {
  var body = document.getElementById('email-body');
  var html = body.innerHTML;
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type: 'text/html'}),
      'text/plain': new Blob([body.innerText], {type: 'text/plain'}),
    })]);
    flash(event.target, '{{BUTTON_COPIED}}');
  } catch (error) {
    var range = document.createRange();
    range.selectNodeContents(body);
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    flash(event.target, 'Selecionado, use Cmd+C');
  }
});

document.getElementById('copy-subject').addEventListener('click', async function(event) {
  try {
    await navigator.clipboard.writeText('{{SUBJECT}}');
    flash(event.target, '{{BUTTON_COPIED}}');
  } catch (error) {
    flash(event.target, 'Falhou');
  }
});
</script>
</body>
</html>
