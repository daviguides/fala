<!--
  Fala Email Template
  Compose window preview + copy buttons for subject and body.

  PLACEHOLDERS (replace when generating):
    {{TITLE}}       Browser tab title (2 to 4 words, no recipient name)
    {{TO_EMAIL}}    Recipient email
    {{SUBJECT}}     Email subject line
    {{EMAIL_BODY}}  Email body, rich HTML with ALL styles inline

  BODY RULES (what gets pasted into Gmail):
    - Styles inline on each element (email clients drop <style> blocks)
    - NO inline text color and NO background color anywhere in the body.
      Text inherits the card color in the preview (readable in light and
      dark mode) and the client default when pasted.
    - Rich structure is expected, not plain paragraphs:
        section titles   <p style="margin:0 0 8px 0;font-size:15px;"><span style="font-weight:600;">Title</span></p>
        bold             <span style="font-weight:600;">text</span>
        tables           <table cellpadding="0" cellspacing="0" style="border-collapse:collapse;">,
                         cells with padding and rgb() borders only
        lists            <ol style="margin:0 0 16px 22px;padding:0;"> / <ul ...>
        callout          <div style="border-left:3px solid rgb(79,70,229);padding:4px 0 4px 14px;">
    - Paragraph spacing via inline margin: <p style="margin:0 0 16px 0;">
    - Colors (borders only) as rgb() values
    - NO flexbox or grid inside the body, use <table>

  PAGE CHROME: the <style> block below styles only the preview page,
  never the body content.
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; padding: 32px 16px; background: rgb(246, 247, 249); color: rgb(31, 41, 55); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .page { max-width: 760px; margin: 0 auto; }
    .actions { text-align: right; margin-bottom: 12px; }
    button { padding: 8px 14px; margin-left: 6px; border: 1px solid rgb(209, 213, 219); border-radius: 7px; background: rgb(255, 255, 255); color: rgb(31, 41, 55); cursor: pointer; }
    .card { background: rgb(255, 255, 255); border: 1px solid rgb(229, 231, 235); border-radius: 10px; overflow: hidden; }
    .header { padding: 12px 18px; background: rgb(55, 65, 81); color: rgb(255, 255, 255); font-weight: 600; }
    .field { padding: 10px 18px; border-bottom: 1px solid rgb(229, 231, 235); font-size: 14px; }
    .label { display: inline-block; width: 74px; color: rgb(107, 114, 128); }
    .body { padding: 22px 18px; line-height: 1.55; }
    @media (prefers-color-scheme: dark) {
      body { background: rgb(17, 24, 39); color: rgb(229, 231, 235); }
      button, .card { background: rgb(31, 41, 55); color: rgb(229, 231, 235); border-color: rgb(75, 85, 99); }
      .field { border-color: rgb(75, 85, 99); }
      .label { color: rgb(156, 163, 175); }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="actions">
      <button id="copy-subject" type="button">Copiar assunto</button>
      <button id="copy-body" type="button">Copiar corpo</button>
    </div>
    <div class="card">
      <div class="header">Nova mensagem</div>
      <div class="field"><span class="label">Para</span>{{TO_EMAIL}}</div>
      <div class="field"><span class="label">Assunto</span><span id="subject" style="font-weight: 600;">{{SUBJECT}}</span></div>
      <div class="body" id="email-body">
        {{EMAIL_BODY}}
      </div>
    </div>
  </div>
  <script>
    function flash(button, text) {
      var original = button.textContent;
      button.textContent = text;
      setTimeout(function () { button.textContent = original; }, 1500);
    }
    document.getElementById('copy-subject').addEventListener('click', async function (event) {
      await navigator.clipboard.writeText(document.getElementById('subject').innerText);
      flash(event.target, 'Copiado');
    });
    document.getElementById('copy-body').addEventListener('click', async function (event) {
      var body = document.getElementById('email-body');
      try {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([body.innerHTML], { type: 'text/html' }),
          'text/plain': new Blob([body.innerText], { type: 'text/plain' })
        })]);
        flash(event.target, 'Copiado');
      } catch (error) {
        var range = document.createRange();
        range.selectNodeContents(body);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        flash(event.target, 'Selecionado, use Cmd+C');
      }
    });
  </script>
</body>
</html>
